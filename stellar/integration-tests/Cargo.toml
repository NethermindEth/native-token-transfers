[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
autotests = false

[lib]

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-ntt-client = { workspace = true }
wormhole-soroban-client = { workspace = true }
stellar-xdr = { workspace = true, features = ["base64"] }
serde_json = "1.0"
stellar-strkey = "0.0.13"
hex = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }
secp256k1 = { version = "0.32.0-beta.2", default-features = false, features = ["alloc", "recovery"] }

[[test]]
name = "integration"
path = "tests/run.rs"
