[workspace]
members = [
  "contracts/manager",
  "contracts/transceiver",
  "contracts/soroban-ntt-client",
  "contracts/mock-token",
  "integration-tests",
]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
soroban-sdk = { version = "=25.3.0", features = ["hazmat-address"] }
stellar-xdr = "25"
wormhole-soroban-client = { git = "https://github.com/NethermindEth/wormhole", branch = "stellar" }
soroban-ntt-client = { path = "contracts/soroban-ntt-client" }
stellar-access = "=0.7.1"
stellar-contract-utils = "=0.7.1"
stellar-macros = "=0.7.1"

[profile.release]
overflow-checks = true
